<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <style>
    body { width: 300px; margin: 0; padding: 14px; font: 13px system-ui, sans-serif; color: #1d1d1f; }
    h1 { font-size: 15px; margin: 0 0 8px; }
    p { margin: 8px 0; line-height: 1.4; }
    label { display: block; font-size: 12px; margin: 10px 0 4px; }
    input[type="number"] { width: 60px; padding: 4px 6px; border: 1px solid #ccc; border-radius: 6px; font: inherit; }
    .row { display: flex; gap: 8px; margin-top: 8px; }
    button { flex: 1; padding: 8px; border: 0; border-radius: 6px; background: #0a7a5a; color: #fff; font-weight: 600; cursor: pointer; }
    button.ghost { background: #eee; color: #1d1d1f; }
    button:disabled { opacity: .45; cursor: default; }
    #status { background: #f5f5f7; border-radius: 6px; padding: 8px; min-height: 18px; }
    #status.error { background: #fdecea; color: #a4262c; }
    #counts { font-size: 12px; color: #555; margin: 6px 0 0; min-height: 14px; }
    a { color: #0a7a5a; }
  </style>
</head>
<body>
  <h1>Offres Welcome to the Jungle</h1>
  <p id="hint">Ouvrez une liste d'offres WTTJ, puis lancez la collecte : toutes les pages seront parcourues.</p>
  <label for="maxPages">Nombre de pages max</label>
  <input type="number" id="maxPages" min="1" max="30" value="5">
  <div class="row">
    <button id="start" type="button">Lancer la collecte</button>
    <button id="stop" class="ghost" type="button" disabled>Arrêter</button>
  </div>
  <p id="status">Prêt.</p>
  <p id="counts"></p>
  <div class="row">
    <button id="send" class="ghost" type="button" disabled>Envoyer vers l'Éditeur de CV</button>
  </div>
  <p><a id="appLink" href="http://localhost:4000" target="_blank">Ouvrir l'Éditeur de CV</a></p>
  <script src="popup.js"></script>
</body>
</html>
